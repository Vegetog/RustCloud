# rustcloud-api 模块配置
# 这是一个可执行程序（binary），是整个系统的入口

[package]
name = "rustcloud-api"
version = "0.1.0"
edition = "2021"

# 依赖项
[dependencies]
# 内部依赖（同一个工作空间的其他模块）
rustcloud-core = { path = "../rustcloud-core" }
# 后续会添加：
# rustcloud-crypto = { path = "../rustcloud-crypto" }
# rustcloud-storage = { path = "../rustcloud-storage" }
# rustcloud-auth = { path = "../rustcloud-auth" }
# rustcloud-database = { path = "../rustcloud-database" }

# 异步运行时
tokio = { workspace = true }

# Web 框架
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# 序列化
serde = { workspace = true }
serde_json = { workspace = true }

# 日志
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# 环境变量
dotenv = { workspace = true }

# 错误处理
anyhow = { workspace = true }
