services:
  # =====================
  # Infrastructure
  # =====================
  postgres:
    image: postgres:14-alpine
    container_name: rustcloud-prod-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rustcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rustcloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rustcloud} -d ${POSTGRES_DB:-rustcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rustcloud-prod-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: rustcloud-prod-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: rustcloud-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:?required};
      mc mb local/${STORAGE_BUCKET:-rustcloud} --ignore-existing;
      echo 'Bucket created successfully';
      "
    restart: "no"

  # =====================
  # Database Migration (runs once then exits)
  # =====================
  migration:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: builder
    container_name: rustcloud-prod-migration
    working_dir: /app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-rustcloud}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-rustcloud}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./target/release/migrate"]
    restart: "no"

  # =====================
  # Backend API
  # =====================
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    container_name: rustcloud-prod-api
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-rustcloud}:${POSTGRES_PASSWORD:?required}@postgres:5432/${POSTGRES_DB:-rustcloud}
      DATABASE_MAX_CONNECTIONS: "20"
      DATABASE_MIN_CONNECTIONS: "5"
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      STORAGE_BACKEND: minio
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: ${STORAGE_BUCKET:-rustcloud}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-3600}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-604800}
      ARGON2_MEMORY: ${ARGON2_MEMORY:-65536}
      ARGON2_ITERATIONS: ${ARGON2_ITERATIONS:-3}
      ARGON2_PARALLELISM: ${ARGON2_PARALLELISM:-4}
      RUST_LOG: ${RUST_LOG:-rustcloud=info}
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # =====================
  # Frontend + Nginx Reverse Proxy
  # =====================
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: rustcloud-prod-web
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
